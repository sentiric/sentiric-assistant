name: sentiric_assistant
description: "A voice assistant powered by the Sentiric Platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.2

  # Networking
  web_socket_channel: ^2.4.0

  # Audio Input/Output
  mic_stream: ^0.7.0
  audioplayers: ^5.2.1
  permission_handler: ^11.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true